<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JavaScript</title>
</head>
<body>

<div id="div1">
    <p>Premier paragraphe</p>
    <p>Deuxième paragraphe</p>
    <p>Troisième paragraphe</p>
</div>

<button onclick="afficherParagraphesDansNouveauDocument()">Afficher les paragraphes</button>

<script>
    function afficherParagraphesDansNouveauDocument() {

        const madiv = document.getElementById("div1");
        const mesparDansMadiv = madiv.getElementsByTagName("p");

        const newWindow = window.open();
        const newDoc = newWindow.document;

        newDoc.open();
        for (let i = 0; i < mesparDansMadiv.length; i++) {
            newDoc.write(`<p>${mesparDansMadiv[i].innerText}</p>`);
        }

        newDoc.close();
    }
</script>

</body>
</html>
